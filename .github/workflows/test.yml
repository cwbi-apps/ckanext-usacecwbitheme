name: Theme test suite

on:
  push:
    branches:
      - main
      - 3-non-root-url-paths
  pull_request:
    branches:
      - main
      - 3-non-root-url-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build generated theme CSS
        run: |
          npm ci
          npm run build

      - name: Run Python test suite
        run: python -m unittest discover -s tests
